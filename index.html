<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulund Civic Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-gradient-to-r from-[#0284c7] to-[#1e1b4b] text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg">Mulund Civic Hub</h1>
                <p class="text-xs text-sky-200">Community Issue Tracker</p>
            </div>
            <button onclick="toggleModal()" class="bg-[#38bdf8] text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs shadow">
                + Post Issue
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div id="postsContainer" class="space-y-4">
            <p class="text-center text-slate-400 py-10">Loading issues...</p>
        </div>
    </main>

    <!-- Modal for New Post -->
    <div id="postModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-base text-slate-800">Report New Issue</h2>
                <button onclick="toggleModal()" class="text-slate-400 font-bold text-lg">✕</button>
            </div>
            <form id="issueForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-slate-600">Issue Title</label>
                    <input type="text" id="title" required class="w-full border border-slate-200 rounded-lg p-2.5 text-xs mt-1" placeholder="e.g., Pothole near station">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Category</label>
                    <select id="category" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs mt-1">
                        <option value="Roads">Roads & Potholes</option>
                        <option value="Garbage">Garbage & Cleanliness</option>
                        <option value="Water">Water Supply</option>
                        <option value="Streetlights">Streetlights</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Mulund Area</label>
                    <select id="areaId" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs mt-1">
                        <option value="1">Mulund West</option>
                        <option value="2">Mulund East</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Description</label>
                    <textarea id="description" required rows="3" class="w-full border border-slate-200 rounded-lg p-2.5 text-xs mt-1" placeholder="Describe the problem..."></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">Submit Issue</button>
            </form>
        </div>
    </div>

    <!-- JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
